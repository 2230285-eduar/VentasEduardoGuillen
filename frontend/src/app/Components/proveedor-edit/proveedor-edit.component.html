<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">PROVEEDORES</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form action="">
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.idprov" name="idprov" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Empresa (ID)</label>
          <input type="number" [(ngModel)]="user.idempresa" name="idempresa" placeholder="DIGITE EMPRESA (ID)" class="form-control" autofocus>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Proveedor</label>
          <input type="text" [(ngModel)]="user.proveedor" name="proveedor" placeholder="DIGITE PROVEEDOR" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Direccion</label>
          <input type="text" [(ngModel)]="user.direccion" name="direccion" placeholder="DIGITE DIRECCION" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Telefono</label>
          <input type="text" [(ngModel)]="user.telefono" name="telefono" placeholder="DIGITE TELEFONO" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Responsable</label>
          <input type="text" [(ngModel)]="user.responsable" name="responsable" placeholder="DIGITE RESPONSABLE" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Creacion</label>
          <input type="date" [(ngModel)]="user.fecha_creacion" name="fecha_creacion" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Observaciones</label>
          <input type="text" [(ngModel)]="user.observaciones" name="observaciones" placeholder="DIGITE OBSERVACIONES" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Estado</label>
          <input type="text" [(ngModel)]="user.estado" name="estado" placeholder="DIGITE ESTADO" class="form-control">
        </div>

        <button class="btn btn-success btn-block" (click)="updateUser()" onclick="javascript:alert('Registro Actualizado')">
          Actualizar
        </button>
      </form>
    </div>
  </div>
</div>
