<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE USUARIOS</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate>
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.userid" name="userid" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
  <label for="" class="control-label">Empresa</label>
  <select class="form-control" [(ngModel)]="user.idempresa" name="idempresa" required>
    <option *ngFor="let lista of Empresalist" value={{lista.idempresa}}>{{lista.nombre}}</option>
  </select>
</div>

<div class="form-group">
  <label for="" class="control-label">Sucursal</label>
  <select class="form-control" [(ngModel)]="user.idsuc" name="idsuc" required>
    <option *ngFor="let lista of Sucursaleslist" value={{lista.idsuc}}>{{lista.sucursal}}</option>
  </select>
</div>

<div class="form-group">
  <label for="" class="control-label">Tipo de usuario</label>
  <select class="form-control" [(ngModel)]="user.idtpusuario" name="idtpusuario" required>
    <option *ngFor="let lista of TipoUsuariolist" value={{lista.idtpusuario}}>{{lista.tipo}}</option>
  </select>
</div>

<div class="form-group">
  <label for="" class="control-label">Empleado</label>
  <select class="form-control" [(ngModel)]="user.idemp" name="idemp" required>
    <option *ngFor="let lista of Empleadoslist" value={{lista.idemp}}>{{lista.nombres}} {{lista.apellidos}}</option>
  </select>
</div>

        <div class="form-group">
          <label for="" class="control-label">Usuario</label>
          <input type="text" [(ngModel)]="user.usuario" name="usuario" placeholder="DIGITE USUARIO" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Clave</label>
          <input type="password" [(ngModel)]="user.clave" name="clave" placeholder="DIGITE CLAVE" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Tipo</label>
          <input type="text" [(ngModel)]="user.tipo" name="tipo" placeholder="DIGITE TIPO" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
          Agregar
        </button>
        <button (click)="exportToExcel()" class="btn btn-secondary">Exportar a Excel</button>
        &nbsp;&nbsp; <button class="btn btn-dark" (click)="openPDF()">Descargar PDF</button>`

      </form>
    </div>
  </div>
  <div class="form-group">
          <input type="text" class="form-control" name="filterPost" placeholder="Digite el Usuario que desea Buscar" [(ngModel)]="filterPost">
        </div>
</div>
<br>

<div class="container-fluid">
  <div class="row mt-4">
    <div class="table-responsive">
      <table class="table table-bordered table-hover" id="tabla">
        <thead>
          <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>SUCURSAL</th>
          <th>TIPO USUARIO</th>
          <th>EMPLEADO</th>
          <th>USUARIO</th>
          <th>TIPO</th>
          <th>ESTADO</th>
          <th></th>
          <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let User of TUser | filterusuario:filterPost">
          <td>{{User.userid}}</td>
          <td>{{User.idempresa}}</td>
          <td>{{User.idsuc}}</td>
          <td>{{User.idtpusuario}}</td>
          <td>{{User.idemp}}</td>
          <td>{{User.usuario}}</td>
          <td>{{User.tipo}}</td>
          <td>{{User.estado}}</td>
          <td><button class="btn btn-danger" (click)="EliminarData(User.userid)" onclick="javascript:alert('Registro Eliminado')">Eliminar</button></td>
          <td><button class="btn btn-success" [routerLink]="['/usuario/edit', User.userid]">Actualizar</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
