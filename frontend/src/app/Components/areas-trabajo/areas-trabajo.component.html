<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE AREAS DE TRABAJO</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate>
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.idarea" name="idarea" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Empresa (ID)</label>
          <input type="number" [(ngModel)]="user.idempresa" name="idempresa" placeholder="DIGITE EMPRESA (ID)" class="form-control" autofocus>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Sucursal (ID)</label>
          <input type="number" [(ngModel)]="user.idsuc" name="idsuc" placeholder="DIGITE SUCURSAL (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Area</label>
          <input type="text" [(ngModel)]="user.area" name="area" placeholder="DIGITE AREA" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Creacion</label>
          <input type="date" [(ngModel)]="user.fecha_creacion" name="fecha_creacion" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
          Agregar
        </button>
      </form>
    </div>
  </div>
</div>
<br>

<div class="container-fluid">
  <div class="row mt-4">
    <div class="table-responsive">
      <table class="table table-bordered table-hover">
        <thead>
          <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>SUCURSAL</th>
          <th>AREA</th>
          <th>FECHA CREACION</th>
          <th>ESTADO</th>
          <th></th>
          <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let User of TUser">
          <td>{{User.idarea}}</td>
          <td>{{User.idempresa}}</td>
          <td>{{User.idsuc}}</td>
          <td>{{User.area}}</td>
          <td>{{User.fecha_creacion}}</td>
          <td>{{User.estado}}</td>
          <td><button class="btn btn-danger" (click)="EliminarData(User.idarea)" onclick="javascript:alert('Registro Eliminado')">Eliminar</button></td>
          <td><button class="btn btn-success" [routerLink]="['/areas-trabajo/edit', User.idarea]">Actualizar</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
