<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE AREAS DE TRABAJO</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate>
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.idarea" name="idarea" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
  <label for="" class="control-label">Empresa</label>
  <select class="form-control" [(ngModel)]="user.idempresa" name="idempresa" required>
    <option *ngFor="let lista of Empresalist" value={{lista.idempresa}}>{{lista.nombre}}</option>
  </select>
</div>

<div class="form-group">
  <label for="" class="control-label">Sucursal</label>
  <select class="form-control" [(ngModel)]="user.idsuc" name="idsuc" required>
    <option *ngFor="let lista of Sucursaleslist" value={{lista.idsuc}}>{{lista.sucursal}}</option>
  </select>
</div>

        <div class="form-group">
          <label for="" class="control-label">Area</label>
          <input type="text" [(ngModel)]="user.area" name="area" placeholder="DIGITE AREA" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Creacion</label>
          <input type="date" [(ngModel)]="user.fecha_creacion" name="fecha_creacion" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
          Agregar
        </button>
        <button (click)="exportToExcel()" class="btn btn-secondary">Exportar a Excel</button>
        &nbsp;&nbsp; <button class="btn btn-dark" (click)="openPDF()">Descargar PDF</button>`

      </form>
    </div>
  </div>
  <div class="form-group">
          <input type="text" class="form-control" name="filterPost" placeholder="Digite el Area de Trabajo que desea Buscar" [(ngModel)]="filterPost">
        </div>

</div>
<br>

<div class="container-fluid">
  <div class="row mt-4">
    <div class="table-responsive">
      <table class="table table-bordered table-hover" id="tabla">
        <thead>
          <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>SUCURSAL</th>
          <th>AREA</th>
          <th>FECHA CREACION</th>
          <th>ESTADO</th>
          <th></th>
          <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let User of TUser | filterarea:filterPost">
          <td>{{User.idarea}}</td>
          <td>{{User.idempresa}}</td>
          <td>{{User.idsuc}}</td>
          <td>{{User.area}}</td>
          <td>{{User.fecha_creacion}}</td>
          <td>{{User.estado}}</td>
          <td><button class="btn btn-danger" (click)="EliminarData(User.idarea)" onclick="javascript:alert('Registro Eliminado')">Eliminar</button></td>
          <td><button class="btn btn-success" [routerLink]="['/areas-trabajo/edit', User.idarea]">Actualizar</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
