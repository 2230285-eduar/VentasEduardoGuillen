<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">PAGOS</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form action="">
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.idpago" name="idpago" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Empresa (ID)</label>
          <input type="number" [(ngModel)]="user.idempresa" name="idempresa" placeholder="DIGITE EMPRESA (ID)" class="form-control" autofocus>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Venta (No.)</label>
          <input type="number" [(ngModel)]="user.num_venta" name="num_venta" placeholder="DIGITE VENTA (NO.)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Sucursal (ID)</label>
          <input type="number" [(ngModel)]="user.idsuc" name="idsuc" placeholder="DIGITE SUCURSAL (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Cliente (No.)</label>
          <input type="number" [(ngModel)]="user.num_clie" name="num_clie" placeholder="DIGITE CLIENTE (NO.)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Usuario (ID)</label>
          <input type="number" [(ngModel)]="user.userid" name="userid" placeholder="DIGITE USUARIO (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Forma de pago (ID)</label>
          <input type="number" [(ngModel)]="user.idfpago" name="idfpago" placeholder="DIGITE FORMA DE PAGO (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Pago</label>
          <input type="date" [(ngModel)]="user.fecha_pago" name="fecha_pago" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Producto (No.)</label>
          <input type="number" [(ngModel)]="user.num_prod" name="num_prod" placeholder="DIGITE PRODUCTO (NO.)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Cantidad</label>
          <input type="number" [(ngModel)]="user.cantidad" name="cantidad" placeholder="DIGITE CANTIDAD" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Precio</label>
          <input type="number" [(ngModel)]="user.precio" name="precio" placeholder="DIGITE PRECIO" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">ISV</label>
          <input type="number" [(ngModel)]="user.isv" name="isv" placeholder="DIGITE ISV" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Descuento</label>
          <input type="number" [(ngModel)]="user.descuento" name="descuento" placeholder="DIGITE DESCUENTO" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Total</label>
          <input type="number" [(ngModel)]="user.total" name="total" placeholder="DIGITE TOTAL" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Estado</label>
          <input type="text" [(ngModel)]="user.estado" name="estado" placeholder="DIGITE ESTADO" class="form-control">
        </div>

        <button class="btn btn-success btn-block" (click)="updateUser()" onclick="javascript:alert('Registro Actualizado')">
          Actualizar
        </button>
      </form>
    </div>
  </div>
</div>
