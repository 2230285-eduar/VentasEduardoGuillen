<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">PRODUCTOS</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form action="">
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.num_prod" name="num_prod" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Empresa (ID)</label>
          <input type="number" [(ngModel)]="user.idempresa" name="idempresa" placeholder="DIGITE EMPRESA (ID)" class="form-control" autofocus>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Sucursal (ID)</label>
          <input type="number" [(ngModel)]="user.idsuc" name="idsuc" placeholder="DIGITE SUCURSAL (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Tipo de producto (ID)</label>
          <input type="number" [(ngModel)]="user.idtpprod" name="idtpprod" placeholder="DIGITE TIPO DE PRODUCTO (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Descripcion</label>
          <input type="text" [(ngModel)]="user.descripcion" name="descripcion" placeholder="DIGITE DESCRIPCION" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Presentacion</label>
          <input type="text" [(ngModel)]="user.presentacion" name="presentacion" placeholder="DIGITE PRESENTACION" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Marca</label>
          <input type="text" [(ngModel)]="user.marca" name="marca" placeholder="DIGITE MARCA" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Valor</label>
          <input type="number" [(ngModel)]="user.valor" name="valor" placeholder="DIGITE VALOR" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Precio Venta</label>
          <input type="number" [(ngModel)]="user.precioventa" name="precioventa" placeholder="DIGITE PRECIO VENTA" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Existencia</label>
          <input type="number" [(ngModel)]="user.existencia" name="existencia" placeholder="DIGITE EXISTENCIA" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Ingreso</label>
          <input type="date" [(ngModel)]="user.fecha_ingreso" name="fecha_ingreso" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Actualiza</label>
          <input type="date" [(ngModel)]="user.fecha_actualiza" name="fecha_actualiza" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Estado</label>
          <input type="text" [(ngModel)]="user.estado" name="estado" placeholder="DIGITE ESTADO" class="form-control">
        </div>

        <button class="btn btn-success btn-block" (click)="updateUser()" onclick="javascript:alert('Registro Actualizado')">
          Actualizar
        </button>
      </form>
    </div>
  </div>
</div>
