<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">EMPLEADOS</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form action="">
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.idemp" name="idemp" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Empresa (ID)</label>
          <input type="number" [(ngModel)]="user.idempresa" name="idempresa" placeholder="DIGITE EMPRESA (ID)" class="form-control" autofocus>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Sucursal (ID)</label>
          <input type="number" [(ngModel)]="user.idsuc" name="idsuc" placeholder="DIGITE SUCURSAL (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Area (ID)</label>
          <input type="number" [(ngModel)]="user.idarea" name="idarea" placeholder="DIGITE AREA (ID)" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Identidad</label>
          <input type="text" [(ngModel)]="user.identidad" name="identidad" placeholder="DIGITE IDENTIDAD" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha de Nacimiento</label>
          <input type="date" [(ngModel)]="user.fecha_nac" name="fecha_nac" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Nombres</label>
          <input type="text" [(ngModel)]="user.nombres" name="nombres" placeholder="DIGITE NOMBRES" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Apellidos</label>
          <input type="text" [(ngModel)]="user.apellidos" name="apellidos" placeholder="DIGITE APELLIDOS" class="form-control">
        </div>

        <div class="form-check">
          <input type="checkbox" [(ngModel)]="user.femenino" name="femenino" id="femenino" class="form-check-input">
          <label for="femenino" class="form-check-label">Femenino</label>
        </div>

        <div class="form-check">
          <input type="checkbox" [(ngModel)]="user.masculino" name="masculino" id="masculino" class="form-check-input">
          <label for="masculino" class="form-check-label">Masculino</label>
        </div>

        <div class="form-check">
          <input type="checkbox" [(ngModel)]="user.soltero" name="soltero" id="soltero" class="form-check-input">
          <label for="soltero" class="form-check-label">Soltero</label>
        </div>

        <div class="form-check">
          <input type="checkbox" [(ngModel)]="user.casado" name="casado" id="casado" class="form-check-input">
          <label for="casado" class="form-check-label">Casado</label>
        </div>

        <div class="form-check">
          <input type="checkbox" [(ngModel)]="user.unionlibre" name="unionlibre" id="unionlibre" class="form-check-input">
          <label for="unionlibre" class="form-check-label">Union Libre</label>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Direccion</label>
          <input type="text" [(ngModel)]="user.direccion" name="direccion" placeholder="DIGITE DIRECCION" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Fecha Creacion</label>
          <input type="date" [(ngModel)]="user.fecha_creacion" name="fecha_creacion" placeholder="Seleccione la Fecha" class="form-control">
        </div>

        <button class="btn btn-success btn-block" (click)="updateUser()" onclick="javascript:alert('Registro Actualizado')">
          Actualizar
        </button>
      </form>
    </div>
  </div>
</div>
