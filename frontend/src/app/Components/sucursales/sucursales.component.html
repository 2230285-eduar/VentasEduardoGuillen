<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE SUCURSALES</a>
</nav>

<div class="row mt-5">
  <div class="card">
    <div class="card-body">
      <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate>
        <div class="form-group">
          <label for="" class="control-label" hidden>Registro No.</label>
          <input type="text" readonly="readonly" [(ngModel)]="user.idsuc" name="idsuc" placeholder="No" class="form-control" required hidden>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Empresa (ID)</label>
          <input type="number" [(ngModel)]="user.idempresa" name="idempresa" placeholder="DIGITE EMPRESA (ID)" class="form-control" autofocus>
        </div>

        <div class="form-group">
          <label for="" class="control-label">Sucursal</label>
          <input type="text" [(ngModel)]="user.sucursal" name="sucursal" placeholder="DIGITE SUCURSAL" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Direccion</label>
          <input type="text" [(ngModel)]="user.dirsuc" name="dirsuc" placeholder="DIGITE DIRECCION" class="form-control">
        </div>

        <div class="form-group">
          <label for="" class="control-label">Telefono</label>
          <input type="text" [(ngModel)]="user.telefono" name="telefono" placeholder="DIGITE TELEFONO" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
          Agregar
        </button>
      </form>
    </div>
  </div>
</div>
<br>

<div class="container-fluid">
  <div class="row mt-4">
    <div class="table-responsive">
      <table class="table table-bordered table-hover">
        <thead>
          <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>SUCURSAL</th>
          <th>DIRECCION</th>
          <th>TELEFONO</th>
          <th>ESTADO</th>
          <th></th>
          <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let User of TUser">
          <td>{{User.idsuc}}</td>
          <td>{{User.idempresa}}</td>
          <td>{{User.sucursal}}</td>
          <td>{{User.dirsuc}}</td>
          <td>{{User.telefono}}</td>
          <td>{{User.estado}}</td>
          <td><button class="btn btn-danger" (click)="EliminarData(User.idsuc)" onclick="javascript:alert('Registro Eliminado')">Eliminar</button></td>
          <td><button class="btn btn-success" [routerLink]="['/sucursales/edit', User.idsuc]">Actualizar</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
